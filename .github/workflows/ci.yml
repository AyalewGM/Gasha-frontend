name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  synthetic-cross-repository-mve:
    # This is an invented, disposable UC-02 fixture. NOT a Bank release gate.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gasha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gasha_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin backend for cross-repository synthetic proof
        uses: actions/checkout@v4
        with:
          repository: AyalewGM/Gasha-backend
          ref: 7e3e4370ca168c935da5ecb6cb7d9dc96ad377a6
          path: backend
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned checked-out backend and frontend
        run: |
          python -m pip install -e "./backend[dev,postgres]"
          npm ci
      - name: Verify installed backend exact commit
        run: |
          test "$(git -C backend rev-parse HEAD)" = "7e3e4370ca168c935da5ecb6cb7d9dc96ad377a6"
          git rev-parse HEAD
      - name: Recovered synthetic UC-02 worker to authenticated FastAPI + Vite + PG
        env:
          GASHA_CROSS_REPO_MVE: "true"
          GASHA_MVE_BACKEND: backend
          GASHA_MVE_BACKEND_SHA: 7e3e4370ca168c935da5ecb6cb7d9dc96ad377a6
          GASHA_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/gasha_test
        run: npm run test:mve
