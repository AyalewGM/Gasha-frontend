name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  synthetic-cross-repository-mve:
    # This is an invented, disposable UC-02 fixture. NOT a Bank release gate.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gasha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gasha_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin backend for cross-repository synthetic proof
        uses: actions/checkout@v4
        with:
          repository: AyalewGM/Gasha-backend
          ref: 222d469fc451689abe99b10f7c15ccc994ad9092
          path: backend
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned checked-out backend and frontend
        run: |
          python -m pip install -e "./backend[dev,postgres,redis]"
          npm ci
      - name: Verify installed backend exact commit
        run: |
          test "$(git -C backend rev-parse HEAD)" = "222d469fc451689abe99b10f7c15ccc994ad9092"
          git rev-parse HEAD
          git -C backend rev-parse HEAD
      - name: Pinned Redis integrity and worker fail-closed regressions
        env:
          GASHA_TEST_REDIS_URL: redis://127.0.0.1:6379/15
          GASHA_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/gasha_test
        run: |
          PYTHONPATH=backend/tests:backend/src python -m pytest -q \
            backend/tests/test_redis_feature_history.py \
            backend/tests/test_synthetic_shadow_provider.py \
            backend/tests/test_postgres_shadow_feature_recovery.py
      - name: Recovered synthetic UC-02 worker to authenticated FastAPI + Vite + PG
        env:
          GASHA_CROSS_REPO_MVE: "true"
          GASHA_MVE_BACKEND: backend
          GASHA_MVE_BACKEND_SHA: 222d469fc451689abe99b10f7c15ccc994ad9092
          GASHA_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/gasha_test
          GASHA_TEST_REDIS_URL: redis://127.0.0.1:6379/15
        run: npm run test:mve
      - name: Real Chromium UC-02 analyst browser + durable PostgreSQL evidence
        env:
          GASHA_CROSS_REPO_MVE: "true"
          GASHA_MVE_BACKEND: backend
          GASHA_MVE_BACKEND_SHA: 222d469fc451689abe99b10f7c15ccc994ad9092
          GASHA_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/gasha_test
          GASHA_TEST_REDIS_URL: redis://127.0.0.1:6379/15
        run: |
          node --check integration/synthetic_chromium_e2e.mjs
          node integration/synthetic_chromium_e2e.mjs
